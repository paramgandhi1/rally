<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally: Your level. Your court. Your people.</title>
<style>
:root{--bg:#eceff4;--card:#fff;--ink:#12234a;--mute:#5d6b8c;--pri:#43489b;--deep:#2e3578;--lime:#c5e336;--line:#d9deea;--ok:#3d8c5f;--bad:#c4492f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1530;--card:#1a2150;--ink:#eef1fb;--mute:#9aa5cc;--pri:#8d93e8;--line:#2e3778}}
:root[data-theme=dark]{--bg:#0f1530;--card:#1a2150;--ink:#eef1fb;--mute:#9aa5cc;--pri:#8d93e8;--line:#2e3778}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow","Segoe UI",system-ui,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 14px 90px}
h1,h2,h3{font-family:"Archivo Black","Arial Black",Impact,sans-serif;margin:0;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px}
.logo{font:900 26px "Archivo Black","Arial Black",sans-serif;color:var(--pri)}
.logo i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--lime);margin-left:3px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pill.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.scroll .pill{white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #1223461a}
.hd{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tag{font-size:12px;border-radius:99px;padding:2px 9px;background:#c5e33644;color:var(--ink);margin-left:auto}
.meta{color:var(--mute);font-size:13px}
.info{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.btn{background:var(--lime);color:#12234a;border:0;border-radius:12px;padding:10px 16px;font:700 15px inherit;cursor:pointer}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.btn:focus-visible,.pill:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.spots{display:flex;gap:4px;align-items:center;margin-top:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pri)}
.dot.e{background:none;border:2px dashed var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border:0;padding:12px 0;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--lime)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:6px}.seg .pill{flex:1;text-align:center}
.hero{background:var(--deep);color:#fff;border-radius:18px;padding:20px;margin:10px 0}
.hero h1{font-size:26px;line-height:1.1}.hero p{color:#cfd4f5}
.chat{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;padding:4px}
.msg{max-width:80%;padding:8px 11px;border-radius:12px;background:var(--bg)}
.msg.me{align-self:flex-end;background:#c5e33666}
.msg small{display:block;color:var(--mute);font-size:11px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}
.stars button{background:none;border:0;font-size:26px;cursor:pointer;color:var(--line)}.stars button.on{color:#e0b400}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.price{font:900 40px "Archivo Black","Arial Black",sans-serif;color:var(--pri)}
</style></head>
<body><div class="app" id="app"></div><div id="nav"></div>
<script>
const SPORTS=["Pickleball","Padel","Tennis","Table tennis","Squash","Badminton"],LEVELS=["Beginner","Intermediate","Advanced"],
AREAS=["Bandra","Andheri","Powai","Lower Parel"],
COURTS={Bandra:["Khar Gymkhana","Bandra Padel Club"],Andheri:["MCA Recreation Centre","Oshiwara Sports Arena"],Powai:["Powai Pickle Park","Hiranandani Courts"],"Lower Parel":["Kamala Mills Courts","Palladium Rooftop"]},
NEED={Pickleball:4,Padel:4,Tennis:2,"Table tennis":2,Squash:2,Badminton:2};
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const SEED=[
{id:1,host:"Sarah K.",sport:"Pickleball",level:"Intermediate",area:"Andheri",court:"MCA Recreation Centre",date:day(0),time:"19:00",need:4,players:["Sarah K.","Dev","Neha"],note:"Need 1 more for doubles! Chill vibe, competitive rallies."},
{id:2,host:"Jordan T.",sport:"Pickleball",level:"Intermediate",area:"Bandra",court:"Khar Gymkhana",date:day(0),time:"20:00",need:4,players:["Jordan T.","Kabir"],note:"Bring your own paddle if you have one."},
{id:3,host:"Meher S.",sport:"Pickleball",level:"Beginner",area:"Powai",court:"Powai Pickle Park",date:day(1),time:"07:00",need:4,players:["Meher S."],note:"Learning together, no pressure."},
{id:4,host:"Rohan M.",sport:"Padel",level:"Advanced",area:"Bandra",court:"Bandra Padel Club",date:day(1),time:"06:30",need:4,players:["Rohan M.","Tanya","Ishaan"],note:"Sunday-style game, serious rallies."},
{id:5,host:"Aarav P.",sport:"Tennis",level:"Intermediate",area:"Lower Parel",court:"Kamala Mills Courts",date:day(2),time:"18:00",need:2,players:["Aarav P."],note:"Played in college, rusty but keen."},
{id:6,host:"Zoya L.",sport:"Pickleball",level:"Advanced",area:"Andheri",court:"Oshiwara Sports Arena",date:day(3),time:"21:00",need:4,players:["Zoya L.","Vik"],note:"DUPR 4.0+ please."},
{id:7,host:"Imran Q.",sport:"Squash",level:"Beginner",area:"Lower Parel",court:"Palladium Rooftop",date:day(2),time:"08:00",need:2,players:["Imran Q."],note:"First time on court, friendly game."}];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=LS.get("rally",null)||{user:null,games:SEED,joined:[],chats:{},rated:{},freeUsed:false,paid:false,nid:100};
let tab="feed",f={sport:"Pickleball",level:"All",when:"All"},open=null,rateGame=null;
const save=()=>LS.set("rally",S);
const me=()=>S.user.name;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;e.setAttribute("role","status");document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
const fmtD=(d,t)=>{const n=Math.round((new Date(d)-new Date(day(0)))/864e5);const h=+t.slice(0,2);return(n==0?"Today":n==1?"Tomorrow":new Date(d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}))+", "+((h%12)||12)+":"+t.slice(3)+(h<12?" AM":" PM")};
const isIn=g=>g.players.includes(me());
const past=g=>new Date(g.date+"T"+g.time)<new Date();

function render(){
 if(!S.user){onboard();return}
 const nav=$("#nav");
 nav.innerHTML='<nav><div>'+[["feed","Feed"],["mine","My games"],["chat","Chat"],["me","Profile"]].map(([k,l])=>`<button class="${tab==k?"on":""}" data-t="${k}">${l}</button>`).join("")+"</div></nav>";
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;open=null;rateGame=null;render()});
 const head=`<div class="top"><span class="logo">RALLY<i></i></span><span class="meta">${esc(S.user.area)} · ${esc(S.user.level)}</span></div>`;
 $("#app").innerHTML=head+({feed,mine,chat,me:profile}[tab])();
 bind();
}
let ob={sport:"Pickleball",level:"Intermediate",area:"Bandra",name:""};
function onboard(){
 $("#nav").innerHTML="";
 const seg=(k,a)=>`<div class="row">${a.map(x=>`<button class="pill ${ob[k]==x?"on":""}" data-k="${k}" data-v="${x}">${x}</button>`).join("")}</div>`;
 $("#app").innerHTML=`<div class="top"><span class="logo">RALLY<i></i></span></div>
 <div class="hero"><h1>Someone your level is free at 7.</h1><p>Tell Rally your sport, level, area and when you're free. First game is free.</p></div>
 <div class="card"><label for="nm">Your name</label><input id="nm" value="${esc(ob.name)}" placeholder="e.g. Aarav">
 <label>Sport</label>${seg("sport",SPORTS)}<label>Your level</label>${seg("level",LEVELS)}
 <p class="meta" style="margin:6px 0 0">Other players confirm your level after each game, so it stays honest.</p>
 <label>Area</label>${seg("area",AREAS)}
 <label>When are you usually free?</label>${seg("free",["Weekday mornings","Weekday evenings","Weekends"]) }
 <div style="margin-top:16px"><button class="btn" id="go" style="width:100%">Find my games</button></div></div>`;
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ob.name=$("#nm").value;ob[b.dataset.k]=b.dataset.v;onboard()});
 $("#go").onclick=()=>{const n=$("#nm").value.trim();if(!n){toast("Add your name to continue");$("#nm").focus();return}
  S.user={name:n,sport:ob.sport,level:ob.level,area:ob.area,free:ob.free||"Weekends",dupr:""};f.sport=ob.sport;f.level="All";save();render()}
}
function feed(){
 const chips=(k,a)=>`<div class="scroll">${a.map(x=>`<button class="pill ${f[k]==x?"on":""}" data-f="${k}" data-v="${x}">${x}</button>`).join("")}</div>`;
 let list=S.games.filter(g=>!past(g)&&g.sport==f.sport&&(f.level=="All"||g.level==f.level)&&(f.when=="All"||(f.when=="Today"?g.date==day(0):f.when=="This weekend"?[0,6].includes(new Date(g.date).getDay()):g.area==S.user.area)));
 list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return `<h2 style="font-size:24px">Find your next game.</h2><p class="meta" style="margin:2px 0">Local players are ready to rally.</p>
 ${chips("sport",SPORTS)}${chips("level",["All",...LEVELS])}${chips("when",["All","Today","This weekend","Near me"])}
 ${list.length?list.map(card).join(""):`<div class="empty">No ${f.sport.toLowerCase()} games match yet.<br>Post one and Rally sends it to nearby players.</div>`}
 <div style="position:sticky;bottom:70px;text-align:right"><button class="btn" id="post" style="box-shadow:0 4px 14px #0004">+ Post a game</button></div>`;
}
function card(g){
 const left=g.need-g.players.length,mine=isIn(g);
 const dist=g.area==S.user.area?"In your area":"Other area";
 return `<div class="card"><div class="hd"><div class="av">${esc(g.host[0])}</div><div><b>${esc(g.host)}</b><div class="meta">${esc(g.sport)} · ${dist}</div></div><span class="tag">${g.level}${g.level==S.user.level?" · your level":""}</span></div>
 <div class="info">🕒 ${fmtD(g.date,g.time)}</div><div class="info">📍 ${esc(g.court)}, ${g.area}</div>
 <p style="margin:10px 0 0">${esc(g.note||"")}</p>
 <div class="bar"><div><div class="spots">${Array.from({length:g.need},(_,i)=>`<span class="dot ${i<g.players.length?"":"e"}"></span>`).join("")}</div><div class="meta">${g.players.length}/${g.need} joined${left?` · ${left} spot${left>1?"s":""} left`:" · full"}</div></div>
 ${mine?`<button class="btn sec" data-chat="${g.id}">Open chat</button>`:`<button class="btn" data-join="${g.id}" ${left?"":"disabled"}>${left?"Join match":"Full"}</button>`}</div></div>`;
}
function postForm(){
 const a=S.user.area;
 $("#app").innerHTML=`<div class="top"><span class="logo">RALLY<i></i></span><button class="pill" id="x">Close</button></div><h2 style="font-size:22px">Post a game</h2><p class="meta">Broadcast an open spot to nearby players.</p>
 <div class="card"><label for="ps">Sport</label><select id="ps">${SPORTS.map(s=>`<option ${s==S.user.sport?"selected":""}>${s}</option>`).join("")}</select>
 <label for="pa">Area</label><select id="pa">${AREAS.map(s=>`<option ${s==a?"selected":""}>${s}</option>`).join("")}</select>
 <label for="pc">Court</label><select id="pc"></select>
 <div class="row"><div style="flex:1"><label for="pd">Date</label><input type="date" id="pd" value="${day(1)}" min="${day(0)}"></div><div style="flex:1"><label for="pt">Start time</label><input type="time" id="pt" value="18:00"></div></div>
 <label>Skill level</label><div class="seg" id="pl">${LEVELS.map(l=>`<button class="pill ${l==S.user.level?"on":""}" data-l="${l}">${l}</button>`).join("")}</div>
 <label for="pf">Game format</label><select id="pf"></select>
 <label for="pn">Note (optional)</label><input id="pn" placeholder="Need 1 more for doubles!">
 <div style="margin-top:16px"><button class="btn" id="bc" style="width:100%">Broadcast game request</button></div></div>`;
 let lv=S.user.level;
 const fill=()=>{$("#pc").innerHTML=COURTS[$("#pa").value].map(c=>`<option>${c}</option>`).join("")};fill();$("#pa").onchange=fill;
 const fmt=()=>{const n=NEED[$("#ps").value];$("#pf").innerHTML=n==4?"<option value=4>Doubles · 4 players</option><option value=2>Singles · 2 players</option>":"<option value=2>Singles · 2 players</option>"};fmt();$("#ps").onchange=fmt;
 document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lv=b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on",x==b))});
 $("#x").onclick=render;
 $("#bc").onclick=()=>{
  if(!gate())return;
  const g={id:S.nid++,host:me(),sport:$("#ps").value,level:lv,area:$("#pa").value,court:$("#pc").value,date:$("#pd").value,time:$("#pt").value,need:+$("#pf").value,players:[me()],note:$("#pn").value};
  if(!g.date||!g.time){toast("Pick a date and time");return}
  if(past(g)){toast("That time has passed. Pick a later slot.");return}
  S.games.push(g);S.joined.push(g.id);S.chats[g.id]=[{u:"Rally",t:`Game posted. We've sent it to ${g.level.toLowerCase()} ${g.sport.toLowerCase()} players near ${g.area}.`}];
  tab="mine";save();toast("Game broadcast to nearby players");render()};
}
function gate(){ // first game free, then membership
 if(S.paid||!S.freeUsed){S.freeUsed=true;return true}
 tab="me";toast("Your first game was free. Start a membership to keep playing.");render();return false}
function join(id){
 const g=S.games.find(x=>x.id==id);if(!g||isIn(g)||g.players.length>=g.need)return;
 if(g.level!=S.user.level&&!confirm(`This game is ${g.level}, you're ${S.user.level}. Join anyway?`))return;
 if(!gate())return;
 g.players.push(me());S.joined.push(g.id);
 (S.chats[g.id]=S.chats[g.id]||[]).push({u:"Rally",t:`${me()} joined. ${g.players.length}/${g.need} in.`});
 save();toast(g.players.length==g.need?"Game is full. See you on court!":"You're in");render()}
function mine(){
 if(rateGame)return rateView();
 const gs=S.games.filter(isIn).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(!gs.length)return `<div class="empty">No games yet.<br><button class="btn" style="margin-top:12px" data-go="feed">Find a game</button></div>`;
 return `<h2 style="font-size:22px">My matches</h2>`+gs.map(g=>{
  const p=past(g),left=g.need-g.players.length;
  return `<div class="card"><div class="hd"><b>${esc(g.sport)}</b><span class="tag">${g.level}</span></div>
  <div class="info">🕒 ${fmtD(g.date,g.time)}</div><div class="info">📍 ${esc(g.court)}, ${g.area}</div>
  <p class="meta" style="margin:8px 0">With: ${esc(g.players.filter(x=>x!=me()).join(", ")||"No one yet")}</p>
  ${!p&&left?`<p class="meta">${left} spot${left>1?"s":""} still open. Rally keeps looking at your level.</p>`:""}
  <div class="row"><button class="btn sec" data-chat="${g.id}">Chat</button>
  ${p?(S.rated[g.id]?'<span class="tag">Rated</span>':`<button class="btn" data-rate="${g.id}">Rate players</button>`):`<button class="btn danger" data-drop="${g.id}">Drop out</button>`}
  ${p?"":`<button class="btn sec" data-sim="${g.id}">Simulate game over</button>`}</div></div>`}).join("");
}
function drop(id){
 const g=S.games.find(x=>x.id==id);if(!confirm("Drop out of this game? Rally will find a replacement for the others."))return;
 g.players=g.players.filter(x=>x!=me());S.joined=S.joined.filter(x=>x!=id);
 const others=g.players.length;
 if(g.host==me()&&others){g.host=g.players[0]}
 if(!others)S.games=S.games.filter(x=>x.id!=id);
 else (S.chats[id]=S.chats[id]||[]).push({u:"Rally",t:`${me()} dropped out. Finding a ${g.level.toLowerCase()} replacement near ${g.area}.`});
 save();toast("Done. Rally is finding a replacement");render()}
function rateView(){
 const g=S.games.find(x=>x.id==rateGame);const others=g.players.filter(x=>x!=me());
 return `<h2 style="font-size:22px">How was the game?</h2><p class="meta">Confirm each player's level so future matches stay fair.</p>
 ${others.map((p,i)=>`<div class="card"><div class="hd"><div class="av">${esc(p[0])}</div><b>${esc(p)}</b></div>
 <div class="seg" style="margin-top:10px" data-p="${i}">${["Plays lower","Right level","Plays higher"].map((l,j)=>`<button class="pill ${j==1?"on":""}" data-v="${j}">${l}</button>`).join("")}</div></div>`).join("")||'<div class="empty">No other players to rate.</div>'}
 <div class="row"><button class="btn" id="sr">Submit ratings</button><button class="btn sec" id="cr">Cancel</button></div>`;
}
function chat(){
 const ids=S.games.filter(isIn).map(g=>g.id);
 if(open==null&&ids.length)open=null;
 if(open){const g=S.games.find(x=>x.id==open),m=S.chats[open]||[];
  return `<div class="row" style="align-items:center"><button class="pill" id="back">Back</button><b>${esc(g.sport)} · ${fmtD(g.date,g.time)}</b></div>
  <div class="card"><div class="chat" id="cl">${m.map(x=>`<div class="msg ${x.u==me()?"me":""}"><small>${esc(x.u)}</small>${esc(x.t)}</div>`).join("")||'<div class="empty">Say hi to your group.</div>'}</div>
  <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="mi" placeholder="Message the group" aria-label="Message"><button class="btn" id="ms">Send</button></div></div>`}
 const gs=S.games.filter(isIn);
 if(!gs.length)return `<div class="empty">Join a game to unlock its group chat.</div>`;
 return `<h2 style="font-size:22px">Chat</h2>`+gs.map(g=>{const m=S.chats[g.id]||[],l=m[m.length-1];
  return `<div class="card" data-chat="${g.id}" style="cursor:pointer"><b>${esc(g.sport)} · ${fmtD(g.date,g.time)}</b><div class="meta">${esc(l?l.u+": "+l.t:"No messages yet")}</div></div>`}).join("");
}
function profile(){
 const u=S.user;
 return `<div class="card"><div class="hd"><div class="av">${esc(u.name[0])}</div><div><b>${esc(u.name)}</b><div class="meta">${esc(u.sport)} · ${esc(u.area)} · free ${esc(u.free).toLowerCase()}</div></div></div>
 <label>Your level</label><div class="seg" id="lv">${LEVELS.map(l=>`<button class="pill ${l==u.level?"on":""}" data-lv="${l}">${l}</button>`).join("")}</div>
 ${u.sport=="Pickleball"?`<label for="du">DUPR rating (optional)</label><input id="du" value="${esc(u.dupr||"")}" inputmode="decimal" placeholder="e.g. 3.5">`:""}
 <div style="margin-top:12px"><button class="btn sec" id="sp">Save profile</button></div></div>
 <div class="card"><h3 style="font-size:18px">Membership</h3>
 ${S.paid?`<p>You're a member. Unlimited games, ratings and replacements.</p><button class="btn sec" id="cancel">Cancel membership</button>`:
 `<div class="price">₹199<span class="meta" style="font:15px sans-serif"> a month</span></div><p class="meta" style="margin:0 0 8px">About ₹7 a day. Covers matching, ratings and replacements. Court fees are paid separately to the venue.</p>
 <p>${S.freeUsed?"Your free first game is used.":"Your first game is free."}</p>
 <div class="row"><button class="btn" data-pay="m">Monthly ₹199</button><button class="btn sec" data-pay="y">Yearly ₹1,999 (2 months free)</button></div>`}</div>
 <div class="card"><button class="btn danger" id="reset">Reset demo</button></div>`;
}
function bind(){
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f[b.dataset.f]=b.dataset.v;render()});
 document.querySelectorAll("[data-join]").forEach(b=>b.onclick=()=>join(+b.dataset.join));
 document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{tab="chat";open=+b.dataset.chat;render()});
 document.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>drop(+b.dataset.drop));
 document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{rateGame=+b.dataset.rate;render()});
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
 document.querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>{const g=S.games.find(x=>x.id==+b.dataset.sim);g.date=day(-1);save();toast("Game marked as played");render()});
 const p=$("#post");if(p)p.onclick=postForm;
 const bk=$("#back");if(bk)bk.onclick=()=>{open=null;render()};
 const ms=$("#ms");if(ms){const send=()=>{const v=$("#mi").value.trim();if(!v)return;(S.chats[open]=S.chats[open]||[]).push({u:me(),t:v});
   const g=S.games.find(x=>x.id==open),o=g.players.filter(x=>x!=me());
   if(o.length)setTimeout(()=>{(S.chats[open]).push({u:o[0],t:["Sounds good!","See you there.","I'll bring balls.","On my way early."][Math.floor(Math.random()*4)]});save();if(tab=="chat"&&open)render()},1200);
   save();render();$("#mi").focus()};ms.onclick=send;$("#mi").onkeydown=e=>{if(e.key=="Enter")send()};const cl=$("#cl");if(cl)cl.scrollTop=cl.scrollHeight}
 document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.user.level=b.dataset.lv;save();render()});
 const sp=$("#sp");if(sp)sp.onclick=()=>{const d=$("#du");if(d){const v=d.value.trim();if(v&&(isNaN(v)||v<1||v>8)){toast("DUPR is a number from 1.0 to 8.0");return}S.user.dupr=v}save();toast("Profile saved")};
 document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{S.paid=true;save();toast(b.dataset.pay=="m"?"Membership active: ₹199 a month":"Membership active: ₹1,999 a year");render()});
 const c=$("#cancel");if(c)c.onclick=()=>{S.paid=false;save();render()};
 const r=$("#reset");if(r)r.onclick=()=>{if(confirm("Clear all data and start over?")){try{localStorage.removeItem("rally")}catch(e){}location.reload()}};
 document.querySelectorAll("[data-p]").forEach(s=>s.querySelectorAll("button").forEach(b=>b.onclick=()=>{s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b))}));
 const sr=$("#sr");if(sr){sr.onclick=()=>{S.rated[rateGame]=true;save();rateGame=null;toast("Thanks. Every rated game makes the next match better");render()};$("#cr").onclick=()=>{rateGame=null;render()}}
}
render();
</script></body></html>
